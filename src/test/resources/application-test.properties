# --- [ POŁĄCZENIE ] ---
spring.datasource.url=jdbc:postgresql://localhost:5433/gym
spring.datasource.username=gym
spring.datasource.password=gym
spring.datasource.driver-class-name=org.postgresql.Driver

# --- [ JPA / HIBERNATE ] ---
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# 'create-drop' czyści bazę przy starcie i zamknięciu - IDEALNE do testów
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# --- [ LOGOWANIE SQL ] ---
# To sprawi, że SQL w konsoli będzie czytelny, a nie w jednej długiej linii
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true
logging.level.org.hibernate.SQL=DEBUG

# --- [ OPTYMALIZACJA ] ---
# Wyłącza niepotrzebne w testach rzeczy
spring.thymeleaf.cache=false
spring.jpa.open-in-view=false