# ===============================================================================
# APPLICATION-TEST-LOCAL.PROPERTIES
# Profile: test-local | Target: Persistent Docker Container (PostgreSQL 16)
# ===============================================================================

# --- [ SERVER & SECURITY ] ---
server.port=0
server.ssl.enabled=false

# Dummy values to satisfy security placeholders in SecurityConfig
SSL_KEY_STORE_TYPE=PKCS12
SSL_KEY_STORE=classpath:dummy-keystore.p12
SSL_KEY_STORE_PASSWORD=dummy-password
SSL_KEY_PASSWORD=dummy-password
SSL_KEY_ALIAS=dummy-alias

# --- [ LOCAL DOCKER DATABASE ] ---
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5433/gym
spring.datasource.username=gym
spring.datasource.password=gym

# Mapping to custom placeholders used in main application.properties
DB_DRIVER=${spring.datasource.driver-class-name}
DB_URL=${spring.datasource.url}
DB_USERNAME=${spring.datasource.username}
DB_PASSWORD=${spring.datasource.password}

# --- [ JPA / HIBERNATE ] ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true

# --- [ DATABASE INITIALIZATION ] ---
# Force-load schema and 16 test clients from /docker-init/
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:/docker-init/001-schema.sql
spring.sql.init.data-locations=classpath:/docker-init/002-clients.sql
spring.test.database.replace=none

# --- [ HIKARI POOL ] ---
spring.datasource.hikari.pool-name=GymLocalTestPool
spring.datasource.hikari.maximum-pool-size=5

# --- [ LOGGING ] ---
logging.level.pl.szelag.gym=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE