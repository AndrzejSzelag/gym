# ===============================================================================
# APPLICATION-PROD.PROPERTIES
# ===============================================================================
# Profile: Production (prod)
# Purpose: High performance, data integrity, and maximum security.
# ===============================================================================

# --- [ SCHEMA MANAGEMENT STRATEGY ] ---
# 1. BOOTSTRAP: Use 'update' once to generate initial tables.
# 2. STABILIZE: Switch to 'none' to prevent Hibernate from altering live data.
# 3. LOGIC: Use 'spring.sql.init' for PostgreSQL-specific Functions & Triggers.

# STEP 1 (Initial Run Only):
spring.jpa.hibernate.ddl-auto=update
# STEP 2 (Permanent Production State):
# spring.jpa.hibernate.ddl-auto=none

# --- [ SQL SCRIPT EXECUTION ] ---
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:/docker-init/001-schema.sql

# Ensures SQL scripts run BEFORE Hibernate validation/initialization
spring.jpa.defer-datasource-initialization=false

# --- [ SECURITY & SESSION ] ---
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.timeout=2h

# --- [ PERFORMANCE & CACHING ] ---
spring.thymeleaf.cache=true
spring.web.resources.cache.cachecontrol.max-age=30d
spring.web.resources.chain.strategy.content.enabled=true

# --- [ LOGGING & ERROR HANDLING ] ---
# Minimal logging to reduce I/O overhead and protect internal state
logging.level.root=WARN
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=ERROR
logging.level.org.springframework.jdbc.datasource.init=ERROR
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR

# Prevents information leakage via error pages
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false