# ===============================================================================
# GYM MANAGEMENT SYSTEM - BASE CONFIGURATION
# ===============================================================================

# --- [ METADATA & PROFILES ] ---
spring.application.name=gym
app.display.name=GYM
# Overridden by environment variables in Docker/K8s
spring.profiles.active=dev

# --- [ SERVER SETTINGS ] ---
server.port=7777
# Essential for correct Client IP detection behind Nginx/Apache reverse proxies
server.forward-headers-strategy=native
server.compression.enabled=true
server.compression.mime-types=text/html,text/plain,text/css,application/javascript,application/json

# --- [ ENCODING & I18N ] ---
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false
server.tomcat.uri-encoding=UTF-8

# --- [ DATABASE CONNECTION ] ---
# Injected via System Environment Variables (Security Best Practice)
spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=${DB_DRIVER}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# --- [ SSL / TLS CONFIGURATION ] ---
# Requires keystore files to be provided via volumes or environment
server.ssl.enabled=true
server.ssl.key-store-type=${SSL_KEY_STORE_TYPE}
server.ssl.key-store=${SSL_KEY_STORE}
server.ssl.key-store-password=${SSL_KEY_STORE_PASSWORD}
server.ssl.key-password=${SSL_KEY_PASSWORD}
server.ssl.key-alias=${SSL_KEY_ALIAS}

# --- [ DATABASE INITIALIZATION ] ---
spring.jpa.defer-datasource-initialization=true
# 'always' forces SQL scripts to run before Hibernate validation
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:/docker-init/001-schema.sql
# ';;' separator prevents parsing errors for PostgreSQL functions/triggers
spring.sql.init.separator=;;

# --- [ HIBERNATE & JPA ] ---
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true
# Disabled to avoid N+1 issues and long-lived connection hold times
spring.jpa.open-in-view=false
# Padding optimizes query plan caching for 'IN' clauses
spring.jpa.properties.hibernate.query.in_clause_parameter_padding=true
spring.jpa.properties.hibernate.query.plan_cache_max_size=4096

# --- [ HIKARI CONNECTION POOL ] ---
spring.datasource.hikari.pool-name=HikariPoolGYM
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.auto-commit=false
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED
# PostgreSQL specific Prepared Statement optimization
spring.datasource.hikari.data-source-properties.cachePrepStmts=true
spring.datasource.hikari.data-source-properties.prepStmtCacheSize=500
spring.datasource.hikari.data-source-properties.prepStmtCacheSqlLimit=1024

# --- [ VIEW ENGINE (THYMELEAF) ] ---
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML

# --- [ SECURITY & PRIVACY ] ---
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
# Prevents technical info leakage in error responses
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-exception=false

# --- [ STATIC RESOURCES & CACHING ] ---
spring.web.resources.static-locations=classpath:/static/
# Content-based hashing (Cache Busting) for static assets
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**