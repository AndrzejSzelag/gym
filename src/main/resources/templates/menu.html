<nav th:fragment="logged-in-navbar"
     xmlns:th="http://www.thymeleaf.org"
     xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
     class="navbar navbar-expand-lg navbar-dark bg-secondary shadow-lg">

    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/clients}">
            <span th:text="${@environment.getProperty('app.display.name')}">GYM</span>
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarNavContent" aria-controls="navbarNavContent"
                aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNavContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" th:href="@{/users}">
                        <i class="lni lni-users text-danger"></i>
                        <span th:text="#{users.list.header}">Users</span>
                    </a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" th:href="@{/clients}">
                        <i class="lni lni-network text-danger"></i>
                        <span th:text="#{clients.list.header}">Clients</span>
                    </a>
                </li>
            </ul>

            <ul class="navbar-nav">
                <li class="nav-item d-flex align-items-center"
                    sec:authorize="isAuthenticated()"
                    style="color: #f1f1f1;">

                    <span class="me-2" th:text="${#authentication.principal.fullName}">
                        Andrzej Szelag
                    </span>

                    <form method="post" th:action="@{/logout}" class="m-0">
                        <button class="btn btn-sm btn-danger shadow-sm" type="submit" th:text="#{form.logout}">
                            Log out
                        </button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>
