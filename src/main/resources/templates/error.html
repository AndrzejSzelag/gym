<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${@environment.getProperty('app.display.name')}">GYM</title>
    <link rel="stylesheet" href="/css/bootstrap.css" th:href="@{/css/bootstrap.css}"/>
    <link rel="stylesheet" href="/css/icons.css" th:href="@{/css/icons.css}"/>
    <link rel="stylesheet" href="/css/my.css" th:href="@{/css/my.css}"/>
</head>
<body class="app-background d-flex justify-content-center align-items-center">
<div class="card error-card p-5 shadow">
    <div class="app-display-name mb-3"><span th:text="${@environment.getProperty('app.display.name')}">GYM</span></div>
    <hr class="gradient-center-light">
    <!-- Header -->
    <div class="display-header mt-3 mb-4 fw-bolder text-secondary"><span th:text="#{error.error}">Error</span></div>
    <!-- Alerts -->
    <div class="text-center mb-3 fw-bold text-danger">
        <span th:text="${errorMessage} ?: #{modal.error.default}">Sorry, something went wrong.</span>
    </div>
    <div class="text-center mb-3 fw-bolder text-secondary">
        <span th:text="#{error.message.contact}">Please try again or contact the administrator.</span>
    </div>
    <!-- Action -->
    <a th:href="@{/clients}"
       class="mt-3 btn btn-danger w-100 fw-bold rounded-pill d-flex align-items-center justify-content-center gap-2">
        <i class="lni lni-arrow-left"></i>
        <span th:text="#{button.backToClients}">Back</span>
    </a>
</div>
</body>
</html>
