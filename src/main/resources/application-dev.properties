# ===============================================================================
# APPLICATION-DEV.PROPERTIES
# ===============================================================================
# Profile: Development (dev)
# Purpose: Optimized for rapid iteration and debugging.
# ===============================================================================

# --- [ SCHEMA MANAGEMENT (DDL) ] ---
# Drops and recreates the schema on startup/shutdown for a clean state
spring.jpa.hibernate.ddl-auto=update

# --- [ DATABASE INITIALIZATION ] ---
spring.sql.init.mode=always
spring.sql.init.separator=;;
spring.sql.init.schema-locations=classpath:/docker-init/001-schema.sql
spring.sql.init.data-locations=classpath:/docker-init/002-clients.sql
# Ensures scripts run after Hibernate schema creation
spring.jpa.defer-datasource-initialization=true

# --- [ LOGGING & DEBUGGING ] ---
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true

# --- [ SECURITY & SESSION ] ---
server.servlet.session.timeout=30m
# Allows session cookies over plain HTTP for local development
server.servlet.session.cookie.secure=false

# --- [ ERROR HANDLING ] ---
# Detailed reporting (Security Risk: Dev Use Only)
server.error.include-message=always
server.error.include-stacktrace=always
server.error.include-binding-errors=always
server.error.include-exception=true

# --- [ VIEW ENGINE & STATIC RESOURCES ] ---
# Disable caching for instant UI/resource updates
spring.thymeleaf.cache=false
spring.web.resources.chain.strategy.content.enabled=false
spring.web.resources.cache.period=0
spring.web.resources.cache.cachecontrol.no-cache=true
spring.web.resources.cache.cachecontrol.no-store=true

# --- [ PERSISTENCE VALIDATION ] ---
# Strict checks to catch dialect and nullability issues early
spring.jpa.properties.hibernate.hbm2ddl.auto.validate_dialect=true
spring.jpa.properties.hibernate.check_nullability=true