# ============================================================================
# DOCKER COMPOSE CONFIGURATION - GYM STACK
# Services: Java Application, PostgreSQL (App & Sonar), SonarQube
# ============================================================================

services:

  # --- JAVA APPLICATION ---
  gym-app:
    build: .
    container_name: gym-app
    env_file:
      - env.example
    environment:
      - DB_URL=jdbc:postgresql://postgres-gym:5432/gym
    ports:
      - "7777:7777"
    volumes:
      - ./keystore.p12:/app/keystore.p12:ro
    depends_on:
      postgres-gym:
        condition: service_healthy
    networks:
      - gym-network
    restart: unless-stopped

  # --- DATABASE ---
  postgres-gym:
    image: postgres:16-alpine
    container_name: gym-postgres
    environment:
      POSTGRES_DB: gym
      POSTGRES_USER: gym
      POSTGRES_PASSWORD: gym
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5433:5432"
    volumes:
      - postgres-gym-data:/var/lib/postgresql/data
      # Automated initialization via SQL scripts
      - ./docker-init:/docker-entrypoint-initdb.d
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gym -d gym"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - gym-network

  # --- SONARQUBE DATABASE ---
  postgres-sonar:
    image: postgres:16-alpine
    container_name: sonar-postgres
    environment:
      POSTGRES_DB: sonar
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres-sonar-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonar"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - gym-network

  # --- SONARQUBE SERVER ---
  sonarqube:
    image: sonarqube:10.7-community
    container_name: sonarqube
    depends_on:
      postgres-sonar:
        condition: service_healthy
    mem_limit: 2g # Prevents container from consuming excessive host RAM
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://postgres-sonar:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    volumes:
      - sonar-data:/opt/sonarqube/data
      - sonar-extensions:/opt/sonarqube/extensions
      - sonar-logs:/opt/sonarqube/logs
    ports:
      - "9000:9000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/api/system/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - gym-network

volumes:
  postgres-gym-data:
  postgres-sonar-data:
  sonar-data:
  sonar-extensions:
  sonar-logs:

networks:
  gym-network:
    driver: bridge