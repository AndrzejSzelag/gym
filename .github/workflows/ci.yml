name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gym_user
          POSTGRES_PASSWORD: gym_password
          POSTGRES_DB: gym_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-imeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean verify -Ptest
        env:
          # Przekazujemy dane do bazy dla Spring Boota w kontenerze CI
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5433/gym_db
          SPRING_DATASOURCE_USERNAME: gym_user
          SPRING_DATASOURCE_PASSWORD: gym_password

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/site/jacoco/jacoco.xml
          fail_ci_if_error: true

      - name: Publish Test Report
        uses: scacap/action-surefire-report@v1
        if: always()
